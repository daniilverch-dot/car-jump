const save=()=>{const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}if(inVK)VB.send('VKWebAppStorageSet',{key:KEY,value:j}).catch(()=>{})};
if(inVK)VB.send('VKWebAppStorageGet',{keys:[KEY]}).then(r=>{const v=r.keys&&r.keys[0]&&r.keys[0].value;if(!v)return;const o=JSON.parse(v);
 if((o.rec||0)>S.rec||(o.owned||[]).length>S.owned.length||((o.rec||0)===S.rec&&(o.coins||0)>S.coins)){Object.assign(S,o);S.up=Object.assign({jump:0,nitro:0,ramp:0,hop:0},o.up);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderGarage()}}).catch(()=>{});

/* Улучшения */

 {n:'Утро',i:'🌅',sky:['#5b7fd6','#ffb48a','#ffd9a8','#ffe9c2'],sun:[.2,.32],sc:'#fff3c4',cl:'#fff1dccc',dk:0},

 {id:'golf',n:'Гольф-кар',p:150,t:'golf',c:'#fafafa',wr:.3,wx:[-.95,.95],b:[[-1.35,.2],[-1.35,-.12],[1,-.12],[1.55,-.02],[1.55,.2]],w:[],f:1.55,r:-1.35,ly:-.05},

 {id:'van',n:'Минивэн',p:500,t:'van',c:'#eceff1',b:[[-1.85,.2],[-1.85,-.7],[-1.6,-.82],[.6,-.82],[1.3,-.4],[1.88,-.3],[1.9,.2]],w:[[-1.6,-.72],[.5,-.74],[1,-.42],[-1.6,-.42]]},
 {id:'pick',n:'Пикап',p:800,t:'pick',c:'#43a047',b:[[-1.85,.2],[-1.85,-.3],[-.7,-.3],[-.7,-.78],[.4,-.78],[.85,-.4],[1.88,-.3],[1.9,.2]],w:[[-.55,-.44],[-.55,-.68],[.35,-.68],[.7,-.44]]},

 {id:'sport',n:'Спорткар',p:1800,t:'sport',c:'#ff6d00',b:[[-1.85,.2],[-1.85,-.1],[-1.4,-.25],[-.6,-.3],[-.1,-.6],[.5,-.6],[1,-.32],[1.9,-.2],[1.9,.2]],w:[[-.25,-.33],[0,-.55],[.45,-.55],[.8,-.33]]},

 {id:'monster',n:'Монстр-трак',p:4000,t:'monster',c:'#6a1b9a',wr:.62,wx:[-1.15,1.25],b:[[-1.7,-.05],[-1.7,-.55],[-1.4,-.65],[-.6,-.7],[-.35,-1.1],[.55,-1.1],[.9,-.7],[1.75,-.65],[1.85,-.45],[1.85,-.05]],w:[[-.2,-.75],[-.05,-1.02],[.5,-1.02],[.75,-.75]],f:1.85,r:-1.7,ly:-.5}

{const OLD=['hatch','lada','taxi','van','pick','gelik','sport'],id=x=>typeof x==='number'?OLD[x]:x;S.car=id(S.car);S.owned=S.owned.map(id).filter(x=>CARS.some(c=>c.id===x));if(!CARS.some(c=>c.id===S.car))S.car='hatch';if(!S.owned.includes('hatch'))S.owned.push('hatch')}
function drawCar(c,id,wh){const o=CARS.find(x=>x.id===id)||CARS[0],poly=a=>{c.beginPath();a.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()},t=o.t,ly=o.ly===undefined?-.2:o.ly,f=o.f||1.9,rr=o.r||-1.85;
 c.fillStyle=o.c;poly(o.b);
 if(o.w.length){c.fillStyle=o.wc||'#b3e5fc';poly(o.w)}
 c.fillStyle='#ffeb3b';c.fillRect(f-.2,ly,.2,.14);c.fillStyle='#b71c1c';c.fillRect(rr,ly+.08,.12,.14);
 if(t==='taxi'){c.fillStyle='#222';c.fillRect(-.2,-.95,.6,.17);c.fillStyle='#ffeb3b';c.fillRect(-.12,-.91,.44,.09);for(let i=0;i<14;i++){c.fillStyle=i%2?'#fff':'#111';c.fillRect(-1.4+i*.2,-.04,.1,.1)}}

 else if(t==='van'){c.fillStyle='#1e88e5';c.fillRect(-1.85,-.1,3.75,.1)}
 else if(t==='pick'){c.fillStyle='#2e7d32';c.fillRect(-1.8,-.3,1.1,.12)}
 else if(t==='golf'){c.fillStyle='#37474f';c.fillRect(-1.2,-.4,.9,.28);c.fillRect(-1.3,-.72,.14,.6);c.fillStyle='#8d6e63';c.fillRect(-1.62,-.55,.28,.75);c.strokeStyle='#455a64';c.lineWidth=.07;c.beginPath();c.moveTo(-1.2,-.72);c.lineTo(-1.2,-1.1);c.moveTo(1,-.12);c.lineTo(1,-1.1);c.stroke();c.fillStyle='#43a047';c.fillRect(-1.45,-1.2,2.7,.1);c.fillStyle='#b3e5fc99';c.fillRect(.95,-1.05,.07,.93)}
 else if(t==='ice'){c.fillStyle='#fff8e1';c.fillRect(-1.45,-.82,1.3,.45);for(let i=0;i<6;i++){c.fillStyle=i%2?'#fff':'#e91e63';c.fillRect(-1.55+i*.27,-.96,.27,.12)}c.fillStyle='#d7a86e';poly([[-.95,-1.6],[-.45,-1.6],[-.7,-1]]);c.fillStyle='#f48fb1';c.beginPath();c.arc(-.7,-1.68,.28,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(-.7,-1.95,.2,0,7);c.fill();c.fillStyle='#d32f2f';c.beginPath();c.arc(-.7,-2.17,.07,0,7);c.fill()}
 else if(t==='bus'){c.fillStyle='#b3e5fc';for(let i=0;i<6;i++)c.fillRect(-2.45+i*.65,-.88,.5,.38);poly([[1.2,-.9],[1.5,-.9],[1.58,-.5],[1.2,-.5]]);c.fillStyle='#212121';c.fillRect(-2.7,-.2,5.05,.07);c.fillRect(-2.7,-.42,4.2,.04)}

 else{c.fillStyle='#ffffff90';c.fillRect(-1.3,.02,2.6,.06)}
 const wr=o.wr||.38;for(const wx of(o.wx||[-1.15,1.15])){c.save();c.translate(wx,.55-wr);c.fillStyle='#212121';c.beginPath();c.arc(0,0,wr,0,7);c.fill();c.rotate(wh);c.fillStyle='#cfd8dc';c.beginPath();c.arc(0,0,wr*.52,0,7);c.fill();c.strokeStyle='#546e7a';c.lineWidth=.06;c.beginPath();c.moveTo(-wr*.52,0);c.lineTo(wr*.52,0);c.moveTo(0,-wr*.52);c.lineTo(0,wr*.52);c.stroke();c.restore()}}
function renderGarage(){
 const box=$('ups');box.innerHTML='';$('bal').textContent='Баланс: '+Math.floor(S.coins)+' 🪙 CarCoin';

 for(const k in UP){const u=UP[k],l=S.up[k],mx=l>=u.max;

 CARS.forEach(o=>{const own=S.owned.includes(o.id),sel=S.car===o.id;

/* Управление */

let R,mode='menu',cam={x:0,y:0,z:1},parts=[];

function finish(){if(mode!=='run')return;const r=R;mode='res';jumps++;K.l=K.r=K.n=0;
 const d=r.d,earn=Math.round(d*.6+r.fl*10)+5,nr=d>S.rec;S.coins+=earn;if(nr)S.rec=d;save();
 $('pad').style.display='none';lastEarn=earn;$('share').style.display=inVK?'block':'none';{const b=$('dbl');b.style.display=rewardOK?'block':'none';b.textContent='📺 +'+earn+' 🪙 за рекламу (x2)'}
 $('res').innerHTML=`Прыжок: <b>${d.toFixed(1)} м</b>${nr?' · <b style="color:#ffd54a">🏆 НОВЫЙ РЕКОРД!</b>':''}<br>+${earn} 🪙 CarCoin${r.fl?` (сальто: ${r.fl})`:''}`;

   let a=0;
   if(gas&&r.vx<25)a+=9;
   if(nit&&r.vx<48)a+=5.3*nb;
   if(brk)a-=r.vx>0?16:5;
   if(onRamp)a-=GR*SA*.8;
   r.vx=Math.max(-6,r.vx+a*dt);
   r.x=Math.max(-3,r.x+r.vx*dt);
   r.wh+=r.vx/.38*dt;
   if(!r.ln&&r.x>=r.re){
    r.ln=1;r.air=1;const m=1+S.up.jump*.04;
    r.vx=Math.max(r.vx,0)*m;r.vy=r.vx*TA;r.y=r.rh+CH;r.th=A;r.w=0;r.rot=0;r.ht=0;r.hopAt=Math.random()<.2?rand(.4,1.1):-1;popup('ПРЫЖОК!');sndGo()
   }else{
    const on=!r.ln&&r.x>r.rs;
    r.y=(on?(r.x-r.rs)*TA:0)+CH;

   }
  }else{
